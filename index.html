      width: 100%;

    .modal-content > .card-inner {

    }

    .layer {
      position: absolute;

      left: 0;

      height: 100%;
      object-fit: fill;
      opacity: 0;
      pointer-events: none;

    /* BGM 버튼 */

      position: fixed;

    @keyframes flyAndStop {

      100% { transform: translateX(0) translateY(0); opacity: 1; }

  </style>
</head>

  <script>
    let assetsReady = false;

    function prepareImage(img) {
      if (img.dataset.src && !img.getAttribute('src')) {
        img.src = img.dataset.src;
      }

      return new Promise((resolve) => {
        const decodeAndFinish = () => {
          if (img.naturalWidth > 0 && typeof img.decode === 'function') {
            img.decode().catch(() => undefined).finally(resolve);
          } else {
            resolve();
          }
        };

        if (img.complete) {
          decodeAndFinish();
          return;
        }

        img.addEventListener('load', decodeAndFinish, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    }

    async function prepareImages(container) {
      const images = Array.from(container.querySelectorAll('img'));

      // 안드로이드 WebView의 순간 메모리 사용량을 줄이기 위해 한 장씩 준비한다.
      for (const img of images) {
        await prepareImage(img);
      }
    }

    function revealSite() {
      if (assetsReady) return;
      assetsReady = true;

      window.requestAnimationFrame(() => {
        document.body.classList.add('site-ready');
        window.requestAnimationFrame(startPage2WhenVisible);
      });
    }

    function fitCardInner() {
      const imgRatio = 842 / 1191;
      const containers = document.querySelectorAll('.modal-content');
      
      containers.forEach(container => {
        const inner = container.querySelector('.card-inner');
        if (!inner) return;

        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;
        const containerRatio = containerWidth / containerHeight;

        let w, h;
        if (containerRatio > imgRatio) {
          h = containerHeight;
          w = h * imgRatio;
        } else {
          w = containerWidth;
          h = w / imgRatio;
        }

        inner.style.width = w + 'px';
        inner.style.height = h + 'px';
      });
    }

    let lastLayoutWidth = document.documentElement.clientWidth;
    let fitResizeFrame = null;

    function fitCardInnerOnWidthChange() {
      const nextLayoutWidth = document.documentElement.clientWidth;
      if (nextLayoutWidth === lastLayoutWidth) return;

      lastLayoutWidth = nextLayoutWidth;
      if (fitResizeFrame !== null) return;

      fitResizeFrame = window.requestAnimationFrame(() => {
        fitResizeFrame = null;
        fitCardInner();
      });
    }

    window.addEventListener('resize', fitCardInnerOnWidthChange, { passive: true });
    window.addEventListener('load', fitCardInner);
    document.addEventListener('DOMContentLoaded', fitCardInner);

    const bgm = document.getElementById('bgm');
    const bgmBtn = document.getElementById('bgmBtn');
    const musicIcon = document.getElementById('musicIcon');

    const iconPlaying = '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>';
    const iconMuted = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

    let isPlaying = false;

    function playAudio() {
      bgm.play().then(() => {
        musicIcon.innerHTML = iconPlaying;
        isPlaying = true;
      }).catch(err => console.log(err));
    }

    function toggleBgm() {
      if (isPlaying) {
        bgm.pause();
        musicIcon.innerHTML = iconMuted;
        isPlaying = false;
      } else {
        playAudio();
      }
    }

    bgmBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleBgm();
    });

    function systemTouchFirst() {
      if (!isPlaying) playAudio();
      window.removeEventListener('click', systemTouchFirst);
      window.removeEventListener('touchstart', systemTouchFirst);
    }
    window.addEventListener('click', systemTouchFirst);
    window.addEventListener('touchstart', systemTouchFirst);

    const scrollRoot = document.getElementById('scrollRoot');
    const page2 = document.getElementById('page2');
    let page2HasUserScrolled = false;
    let page2ScrollFrame = null;

    function handlePage2Scroll() {
      const requiredScroll = Math.min(80, window.innerHeight * 0.08);
      if (scrollRoot && scrollRoot.scrollTop >= requiredScroll) {
        page2HasUserScrolled = true;
      }

      if (page2ScrollFrame !== null) return;

      page2ScrollFrame = window.requestAnimationFrame(() => {
        page2ScrollFrame = null;
        startPage2WhenVisible();
      });
    }

    function startPage2WhenVisible() {
      if (!assetsReady || !page2AssetsReady || !page2HasUserScrolled || !page2 || page2.classList.contains('play')) return;

      const rect = page2.getBoundingClientRect();
      const triggerLine = window.innerHeight * 0.82;

      if (rect.top <= triggerLine && rect.bottom > 0) {
        page2.classList.add('play');
        scrollRoot.removeEventListener('scroll', handlePage2Scroll);
        window.removeEventListener('resize', startPage2WhenVisible);
      }
    }

    if (scrollRoot) {
      scrollRoot.scrollTop = 0;
      scrollRoot.addEventListener('scroll', handlePage2Scroll, { passive: true });

      let previousTouchY = 0;

      scrollRoot.addEventListener('touchstart', (event) => {
        if (event.touches.length === 1) {
          previousTouchY = event.touches[0].clientY;
        }
      }, { passive: true });

      scrollRoot.addEventListener('touchmove', (event) => {
        if (event.touches.length !== 1) return;

        const currentTouchY = event.touches[0].clientY;
        const fingerDelta = currentTouchY - previousTouchY;
        const maximumScroll = scrollRoot.scrollHeight - scrollRoot.clientHeight;
        const movingPastTop = scrollRoot.scrollTop <= 0 && fingerDelta > 0;
        const movingPastBottom = scrollRoot.scrollTop >= maximumScroll - 1 && fingerDelta < 0;

        if (movingPastTop || movingPastBottom) {
          event.preventDefault();
        }

        previousTouchY = currentTouchY;
      }, { passive: false });
    }
    window.addEventListener('resize', startPage2WhenVisible);
    window.addEventListener('load', startPage2WhenVisible);
    document.addEventListener('DOMContentLoaded', startPage2WhenVisible);

    window.addEventListener('pageshow', () => {
      document.querySelectorAll('.icon-motion-wrapper').forEach((icon) => {
        icon.classList.remove('is-pressed');
      });
      document.querySelectorAll('[data-action-pending]').forEach((button) => {
        button.dataset.actionPending = 'false';
      });

      fitCardInner();
      window.requestAnimationFrame(() => {
        startPage2WhenVisible();
      });
    });

    window.addEventListener('pagehide', () => {
      document.querySelectorAll('.icon-motion-wrapper').forEach((icon) => {
        icon.classList.remove('is-pressed');
      });
      document.querySelectorAll('[data-action-pending]').forEach((button) => {
        button.dataset.actionPending = 'false';
      });
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        fitCardInner();
        startPage2WhenVisible();
      }
    });

    let page2AssetsReady = false;
    const page1 = document.querySelector('.page1');

    const page2AssetsPromise = prepareImages(page1)
      .then(() => {
        revealSite();
        return prepareImages(page2);
      })
      .then(() => {
        page2AssetsReady = true;
        startPage2WhenVisible();
      })
      .catch(() => {
        revealSite();
        page2AssetsReady = true;
        startPage2WhenVisible();
      });

    let page3AssetsPromise = null;

    function preparePage3() {
      if (!page3AssetsPromise) {
        page3AssetsPromise = prepareImages(mapModal);
      }
      return page3AssetsPromise;
    }

    const icon2_1 = document.querySelector('.icon2-1-motion');
    const icon2_2 = document.querySelector('.icon2-2-motion');

    function playIconPress(iconEl) {
      if (!iconEl) return;
      iconEl.classList.add('is-pressed');
    }

    function releaseIconPress(iconEl) {
      if (!iconEl) return;
      iconEl.classList.remove('is-pressed');
    }

    const openDate2Map = document.getElementById('openDate2Map');

    function runAfterPress(button, action) {
      if (!button || button.dataset.actionPending === 'true') return;

      button.dataset.actionPending = 'true';

      window.setTimeout(() => {
        button.dataset.actionPending = 'false';
        action();
      }, 160);
    }

    const openModalIcon = document.getElementById('openModalIcon');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const mapModal = document.getElementById('mapModal');
    let modalCloseTimer = null;

    if (openModalIcon) {
      openModalIcon.addEventListener('click', (e) => {
        e.stopPropagation();
        runAfterPress(openModalIcon, () => {
          if (modalCloseTimer) {
            clearTimeout(modalCloseTimer);
            modalCloseTimer = null;
          }

          preparePage3().then(() => {
            mapModal.classList.remove('closing');
            mapModal.classList.add('active');
            fitCardInner();
          });
        });
      });
    }

    function closeModal() {
      if (!mapModal.classList.contains('active') || mapModal.classList.contains('closing')) {
        return;
      }

      mapModal.classList.add('closing');

      modalCloseTimer = window.setTimeout(() => {
        mapModal.classList.remove('active', 'closing');
        modalCloseTimer = null;
      }, 1300);
    }

    if (closeModalBtn) {
      closeModalBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeModal();
      });
    }

    mapModal.addEventListener('click', (e) => {
      e.target === mapModal && closeModal();
    });

    const copyToast = document.getElementById('copyToast');
    let copyToastTimer = null;

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, text.length);
      document.execCommand('copy');
      textarea.remove();
    }

    async function copyAccountNumber(number) {
      const digitsOnly = String(number).replace(/\D/g, '');

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(digitsOnly);
        } else {
          fallbackCopy(digitsOnly);
        }

        if (copyToastTimer) {
          window.clearTimeout(copyToastTimer);
        }

        copyToast.classList.remove('show');
        void copyToast.offsetWidth;
        copyToast.classList.add('show');

        copyToastTimer = window.setTimeout(() => {
          copyToast.classList.remove('show');
          copyToastTimer = null;
        }, 1550);
      } catch (error) {
        console.log(error);
      }
    }

    document.querySelectorAll('.account-click-area').forEach((button) => {
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        copyAccountNumber(button.dataset.account);
      });
    });

    // 모바일과 컴퓨터 모두 동일한 포인터 누름/해제 모션 실행
    [
      [document.getElementById('openDate2Map'), icon2_1],
      [document.getElementById('openModalIcon'), icon2_2]
    ].forEach(([area, icon]) => {
      if (!area || !icon) return;

      area.addEventListener('pointerdown', () => {
        playIconPress(icon);
      });

      area.addEventListener('pointerup', () => {
        releaseIconPress(icon);
      });

      area.addEventListener('pointercancel', () => {
        releaseIconPress(icon);
      });

      area.addEventListener('pointerleave', () => {
        releaseIconPress(icon);
      });
    });

  </script>

</body>
</html>
