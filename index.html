<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KIMUN & FUTABA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  background:#fff;
  overflow:hidden;
}

body{
  position:fixed;
  inset:0;
}

.scroll-root{
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  background:#fff;
}

/* =========================================================
   PAGE
========================================================= */

.page{
  position:relative;
  width:min(100%,1360px);
  aspect-ratio:1360/1891;
  flex:0 0 auto;
  overflow:hidden;
  background:rgb(0,146,162);
  line-height:0;
}

.page+.page{
  margin-top:0;
}

.layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  opacity:0;
  pointer-events:none;
  display:block;
}


/* =========================================================
   INITIAL LOADER
========================================================= */

.initial-loader{
  position:fixed;
  inset:0;
  z-index:20000;
  background:#fff;
  opacity:1;
  visibility:visible;
  pointer-events:auto;

  transition:
    opacity .45s ease-in-out,
    visibility 0s linear .45s;
}

.site-ready .initial-loader{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}


/* =========================================================
   BGM
========================================================= */

.bgm-btn{
  position:fixed;

  top:max(
    20px,
    env(safe-area-inset-top)
  );

  left:max(
    20px,
    env(safe-area-inset-left)
  );

  z-index:10000;

  width:36px;
  height:36px;

  border-radius:50%;

  border:
    1px solid rgba(0,0,0,.1);

  background:
    rgba(255,255,255,.7);

  display:grid;
  place-items:center;

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;
}

.bgm-btn svg{
  width:18px;
  height:18px;
  fill:#555;
}


/* =========================================================
   KEYFRAMES
========================================================= */

@keyframes fadeIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes growTree{
  from{
    opacity:0;
    transform:scale(0);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes flyAndStop{
  from{
    opacity:0;
    transform:
      translate(120px,-20px);
  }

  to{
    opacity:1;
    transform:
      translate(0,0);
  }
}

@keyframes title2FromLine{
  0%{
    transform:
      translateY(-2.8556%);
  }

  100%{
    transform:
      translateY(0);
  }
}

@keyframes title3FromLine{
  0%{
    transform:
      translateY(-2.9085%);
  }

  100%{
    transform:
      translateY(0);
  }
}

@keyframes title4FromLine{
  0%{
    transform:
      translateY(-2.9085%);
  }

  100%{
    transform:
      translateY(0);
  }
}


/* =========================================================
   TITLE REVEAL
========================================================= */

.title2-reveal,
.title3-reveal,
.title4-reveal{
  position:absolute;
  inset:0;
  z-index:20;
  overflow:hidden;
  visibility:hidden;
  pointer-events:none;
}

.title2-reveal{
  clip-path:
    inset(20.5182% 0 0 0);
}

.title3-reveal{
  clip-path:
    inset(25.8065% 0 0 0);
}

.title4-reveal{
  clip-path:
    inset(30.4072% 0 0 0);
}

.title2-reveal .title22,
.title3-reveal .title32,
.title4-reveal .title42{
  display:none;
  opacity:0!important;
  visibility:hidden;
  width:100%;
  height:100%;
  object-fit:fill;
  position:absolute;
  inset:0;
}

.title2-reveal.run .title22,
.title3-reveal.run .title32{
  display:block;
  opacity:1!important;
  visibility:visible;
}


/* =========================================================
   PAGE 1
========================================================= */

.page1 .tree1{
  transform-origin:
    50% 82%;
}

.site-ready
.page1
.background1{
  animation:
    fadeIn
    1.3s
    ease-in-out
    0s
    both;
}

.site-ready
.page1
.rabbit1{
  animation:
    fadeIn
    1.3s
    ease-in-out
    1.3s
    both;
}

.site-ready
.page1
.tree1{
  animation:
    growTree
    1.3s
    ease-in-out
    2.6s
    both;
}

.site-ready
.page1
.bird1{
  animation:
    flyAndStop
    1.3s
    ease-in-out
    3.9s
    both;
}

.site-ready
.page1
.title1{
  animation:
    fadeIn
    1.3s
    ease-in-out
    5.2s
    both;
}

.site-ready
.page1
.date1{
  animation:
    fadeIn
    1.3s
    ease-in-out
    6.5s
    both;
}

.site-ready
.page1
.name1{
  animation:
    fadeIn
    1.3s
    ease-in-out
    7.8s
    both;
}


/* =========================================================
   PAGE 2 / PAGE 3
========================================================= */

.page2 .background2,
.page2 .photo2,
.page2 .flower2,
.page2 .title21,
.page2 .message2,

.page3 .background3,

.page3 .r31,
.page3 .r32,
.page3 .r33,
.page3 .r34,
.page3 .r35,
.page3 .r36,
.page3 .r37,
.page3 .r38,
.page3 .r39,
.page3 .r310,
.page3 .r311,
.page3 .r312,

.page3 .title31,

.page3 .message3,

.page3 .details3,

.page3 .blessing3{
  opacity:0;
  visibility:hidden;
}

.page2 .background2.run,
.page2 .photo2.run,
.page2 .flower2.run,
.page2 .title21.run,
.page2 .message2.run,

.page3 .background3.run,

.page3 .r31.run,
.page3 .r32.run,
.page3 .r33.run,
.page3 .r34.run,
.page3 .r35.run,
.page3 .r36.run,
.page3 .r37.run,
.page3 .r38.run,
.page3 .r39.run,
.page3 .r310.run,
.page3 .r311.run,
.page3 .r312.run,

.page3 .title31.run,

.page3 .message3.run,

.page3 .details3.run,

.page3 .blessing3.run{
  visibility:visible;

  animation:
    fadeIn
    1.3s
    ease-in-out;
}


/* =========================================================
   PAGE 2 / PAGE 3
   ANIMATION FINISHED
========================================================= */

.page2 .background2.shown,
.page2 .photo2.shown,
.page2 .flower2.shown,
.page2 .title21.shown,
.page2 .message2.shown,

.page3 .background3.shown,

.page3 .r31.shown,
.page3 .r32.shown,
.page3 .r33.shown,
.page3 .r34.shown,
.page3 .r35.shown,
.page3 .r36.shown,
.page3 .r37.shown,
.page3 .r38.shown,
.page3 .r39.shown,
.page3 .r310.shown,
.page3 .r311.shown,
.page3 .r312.shown,

.page3 .title31.shown,

.page3 .message3.shown,

.page3 .details3.shown,

.page3 .blessing3.shown{
  opacity:1!important;
  visibility:visible!important;
  animation:none!important;
}


/* =========================================================
   PAGE 2
========================================================= */

.page2
.title2-reveal.run,

.page2
.title2-reveal.shown{
  visibility:visible;
}

.page2
.title2-reveal.run
.title22{
  display:block;
  opacity:1!important;
  visibility:visible!important;

  animation:
    title2FromLine
    1.3s
    linear;
}

.page2
.title2-reveal.shown
.title22{
  display:block;
  opacity:1!important;
  visibility:visible!important;
  animation:none!important;

  transform:
    translateY(0)!important;
}

.flower2{
  filter:none!important;

  mix-blend-mode:
    normal!important;
}


/* =========================================================
   PAGE 3
========================================================= */

.page3
.icon-place-motion.run,

.page3
.icon-gift-motion.run{
  visibility:visible;

  animation:
    fadeIn
    1.3s
    ease-in-out;
}

.page3
.icon-place-motion.shown,

.page3
.icon-gift-motion.shown{
  opacity:1!important;
  visibility:visible!important;
  animation:none!important;
}

.page3
.title3-reveal.run,

.page3
.title3-reveal.shown{
  visibility:visible;
}

.page3
.title3-reveal.run
.title32{
  display:block;
  opacity:1!important;
  visibility:visible!important;

  animation:
    title3FromLine
    1.3s
    linear;
}

.page3
.title3-reveal.shown
.title32{
  display:block;
  opacity:1!important;
  visibility:visible!important;
  animation:none!important;

  transform:
    translateY(0)!important;
}


/* =========================================================
   ICON
========================================================= */

.icon-motion-wrapper{
  position:absolute;
  z-index:70;
  overflow:hidden;
  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transform:
    scale(1);

  -webkit-transform:
    scale(1);

  transform-origin:
    50% 50%;

  -webkit-transform-origin:
    50% 50%;

  transition:
    transform
    140ms
    ease-out;

  -webkit-transition:
    -webkit-transform
    140ms
    ease-out;

  -webkit-tap-highlight-color:
    transparent;
}

.icon-motion-wrapper.is-pressed{
  transform:
    scale(.82);

  -webkit-transform:
    scale(.82);
}

.page3
.icon-place-motion.ready,

.page3
.icon-gift-motion.ready{
  pointer-events:auto;
}

.icon-place-motion{
  left:66.6667%;
  top:51.0312%;
  width:9.1979%;
  height:6.6103%;
}

.icon-gift-motion{
  left:82.3400%;
  top:89.1063%;
  width:7.5791%;
  height:5.4469%;
}

.icon-crop-source{
  position:absolute;
  max-width:none;
  pointer-events:none;
  object-fit:fill;
}

.icon-place-motion
.icon-crop-source{
  width:1087.2%;
  height:1512.8%;
  left:-724.8%;
  top:-772%;
}

.icon-gift-motion
.icon-crop-source{
  width:1319.4175%;
  height:1835.9223%;
  left:-1086.4078%;
  top:-1635.9223%;
}

.icon-motion-click{
  position:absolute;
  inset:0;
  z-index:3;
  border:0;
  outline:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  -webkit-appearance:none;
}


/* =========================================================
   PAGE 4
========================================================= */

.page4-modal{
  position:fixed;
  inset:0;
  z-index:15000;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,0);

  visibility:hidden;
  pointer-events:none;

  transition:
    background-color
    1.3s
    ease-in-out,

    visibility
    0s
    linear
    1.3s;
}

.page4-modal.active{
  visibility:visible;
  pointer-events:auto;

  background:
    rgba(0,0,0,.62);

  transition:
    background-color
    1.3s
    ease-in-out;
}

.page4-modal.active.closing{
  visibility:visible;
  pointer-events:none;

  background:
    rgba(0,0,0,0);
}

.page4-content{
  position:relative;
  width:100vw;
  height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;

  transition:
    opacity
    1.3s
    ease-in-out;
}

.page4-modal.active
.page4-content{
  opacity:1;
}

.page4-modal.active.closing
.page4-content{
  opacity:0;
}

.page4-card{
  position:relative;

  width:min(
    100vw,
    calc(100dvh * 1360 / 1891),
    1360px
  );

  aspect-ratio:
    1360/1891;

  overflow:hidden;

  background:transparent;
}


/* =========================================================
   PAGE 4 ANIMATION
========================================================= */

.page4-modal.active
.background4{
  animation:
    fadeIn
    1.3s
    ease-in-out
    0s
    both;
}

.page4-modal.active
.rabbit4{
  animation:
    fadeIn
    1.3s
    ease-in-out
    1.3s
    both;
}

.page4-modal.active
.title41{
  animation:
    fadeIn
    1.3s
    ease-in-out
    2.6s
    both;
}

.page4-modal
.title4-reveal{
  visibility:hidden;
}

.page4-modal.active.title4-ready
.title4-reveal{
  visibility:visible;
}

.page4-modal.active.title4-ready
.title4-reveal
.title42{
  display:block;
  opacity:1!important;
  visibility:visible!important;

  animation:
    title4FromLine
    1.3s
    linear
    both;
}

.page4-modal.active.closing.title4-ready
.title4-reveal{
  visibility:visible!important;
}

.page4-modal.active.closing.title4-ready
.title42{
  display:block!important;
  opacity:1!important;
  visibility:visible!important;
  animation:none!important;

  transform:
    translateY(0)!important;
}

.page4-modal.active
.account4{
  animation:
    fadeIn
    1.3s
    ease-in-out
    5.2s
    both;
}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.modal-close-btn{
  position:absolute;

  top:max(
    20px,
    env(safe-area-inset-top)
  );

  right:max(
    20px,
    env(safe-area-inset-right)
  );

  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:
    rgba(0,0,0,.55);

  z-index:100;

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;
}

.modal-close-btn:before,
.modal-close-btn:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:17px;
  height:2px;
  background:#fff;
  border-radius:2px;
}

.modal-close-btn:before{
  transform:
    translate(-50%,-50%)
    rotate(45deg);
}

.modal-close-btn:after{
  transform:
    translate(-50%,-50%)
    rotate(-45deg);
}


/* =========================================================
   ACCOUNT
========================================================= */

.account-click{
  position:absolute;
  z-index:80;
  border:0;
  outline:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  -webkit-appearance:none;
}

.account-kb{
  left:30.5147%;
  top:42.6230%;
  width:38.5294%;
  height:2.0624%;
}

.account-woori{
  left:30.8824%;
  top:52.7763%;
  width:37.7206%;
  height:2.1153%;
}

.account-hana{
  left:32.7206%;
  top:60.4971%;
  width:34.4118%;
  height:2.0624%;
}


/* =========================================================
   COPY TOAST
========================================================= */

.copy-toast{
  position:fixed;
  left:50%;

  bottom:max(
    30px,
    calc(
      env(safe-area-inset-bottom)
      + 18px
    )
  );

  z-index:20000;

  padding:
    10px 17px;

  border-radius:
    999px;

  color:#fff;

  background:
    rgba(0,0,0,.58);

  font-size:14px;

  letter-spacing:
    -.02em;

  white-space:
    nowrap;

  pointer-events:none;

  opacity:0;

  transform:
    translate(-50%,8px);
}

.copy-toast.show{
  animation:
    copyToastFade
    1.55s
    ease-in-out
    both;
}

@keyframes copyToastFade{
  0%{
    opacity:0;

    transform:
      translate(-50%,8px);
  }

  18%,
  70%{
    opacity:.92;

    transform:
      translate(-50%,0);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-3px);
  }
}

</style>
</head>

        type="button"
        data-account="29819040468"
        aria-label="하나은행 계좌번호 복사">
      </button>

    </div>

  </div>

</div>


<div
  class="copy-toast"
  id="copyToast"
  role="status"
  aria-live="polite">

  계좌번호가 복사되었습니다.

</div>


<script>

/* =========================================================
   BASIC
========================================================= */

const root =
  document.getElementById(
    'scrollRoot'
  );

const pages =
  [...document.querySelectorAll(
    '.page'
  )];

const page1 =
  pages[0];

const page2 =
  pages[1];

const page3 =
  pages[2];


/* =========================================================
   PAGE HEIGHT
========================================================= */

function updatePageHeights(){

  pages.forEach(page=>{

    const width =
      page.getBoundingClientRect().width;

    if(
      !width ||
      width <= 0
    ){
      return;
    }

    const height =
      Math.round(
        width * 1891 / 1360
      );

    page.style.height =
      height + 'px';

    page.style.flexBasis =
      height + 'px';

  });

}

updatePageHeights();

let lastViewportWidth =
  window.innerWidth;

function handleViewportResize(){

  const currentWidth =
    window.innerWidth;

  if(
    Math.abs(
      currentWidth -
      lastViewportWidth
    ) < 1
  ){
    return;
  }

  lastViewportWidth =
    currentWidth;

  updatePageHeights();

}

window.addEventListener(
  'resize',
  handleViewportResize,
  {passive:true}
);

window.addEventListener(
  'orientationchange',
  ()=>{

    setTimeout(()=>{

      lastViewportWidth =
        window.innerWidth;

      updatePageHeights();

    },100);

  }
);


/* =========================================================
   IMAGE LOADING
========================================================= */

const imagePromises =
  new WeakMap();

function loadImage(img){

  if(!img){
    return Promise.resolve();
  }

  if(
    img.complete &&
    img.naturalWidth > 0
  ){
    return Promise.resolve();
  }

  if(
    imagePromises.has(img)
  ){
    return imagePromises.get(img);
  }

  if(
    img.dataset.src &&
    !img.getAttribute('src')
  ){
    img.src =
      img.dataset.src;
  }

  const task =
    new Promise(resolve=>{

      if(
        img.complete &&
        img.naturalWidth > 0
      ){
        resolve();
        return;
      }

      const done =
        ()=>resolve();

      img.addEventListener(
        'load',
        done,
        {once:true}
      );

      img.addEventListener(
        'error',
        done,
        {once:true}
      );

    });

  imagePromises.set(
    img,
    task
  );

  return task;

}


/* =========================================================
   SELECTOR IMAGE LOADING
========================================================= */

async function loadSelectorImages(
  page,
  selector
){

  const elements =
    page.querySelectorAll(
      selector
    );

  for(const el of elements){

    if(
      el.tagName === 'IMG'
    ){
      await loadImage(el);
    }

    const images =
      el.querySelectorAll
        ? el.querySelectorAll('img')
        : [];

    for(const img of images){
      await loadImage(img);
    }

  }

}


/* =========================================================
   PAGE 1 INITIAL LOAD
========================================================= */

function waitPage1(){

  const images =
    page1.querySelectorAll(
      'img'
    );

  return Promise.all(

    [...images].map(img=>{

      if(
        img.complete &&
        img.naturalWidth > 0
      ){
        return Promise.resolve();
      }

      return new Promise(resolve=>{

        img.addEventListener(
          'load',
          resolve,
          {once:true}
        );

        img.addEventListener(
          'error',
          resolve,
          {once:true}
        );

      });

    })

  );

}

waitPage1()
  .finally(()=>{

    updatePageHeights();

    requestAnimationFrame(()=>{

      document.body
        .classList
        .add(
          'site-ready'
        );

    });

  });


/* =========================================================
   PAGE 2 / PAGE 3 RUN STEP
========================================================= */

function runStep(
  page,
  selector,
  ready
){

  page
    .querySelectorAll(
      selector
    )
    .forEach(el=>{

      el.classList.remove(
        'shown'
      );

      el.classList.add(
        'run'
      );

      if(ready){
        el.classList.add(
          'ready'
        );
      }

      setTimeout(()=>{

        el.classList.remove(
          'run'
        );

        el.classList.add(
          'shown'
        );

      },1300);

    });

}


/* =========================================================
   PAGE SCHEDULE
========================================================= */

function schedulePage(
  page,
  steps
){

  if(
    !page ||
    page.dataset.started === '1'
  ){
    return;
  }

  page.dataset.started =
    '1';

  steps.forEach(
    ([selector,delay,ready])=>{

      const prepareDelay =
        Math.max(
          0,
          delay * 1000 - 450
        );

      setTimeout(()=>{

        loadSelectorImages(
          page,
          selector
        );

      },prepareDelay);

      setTimeout(
        async()=>{

          await loadSelectorImages(
            page,
            selector
          );

          runStep(
            page,
            selector,
            ready
          );

        },

        Math.max(
          0,
          delay * 1000
        )

      );

    }
  );

}


/* =========================================================
   PAGE START
========================================================= */

function startPage(page){

  if(
    !page ||
    page.dataset.started === '1'
  ){
    return;
  }

  if(
    page.classList.contains(
      'page2'
    )
  ){

    schedulePage(
      page,
      [

        [
          '.background2',
          0
        ],

        [
          '.photo2',
          1.3
        ],

        [
          '.flower2',
          2.6
        ],

        [
          '.title21',
          3.9
        ],

        [
          '.title2-reveal',
          5.2
        ],

        [
          '.message2',
          6.5
        ]

      ]
    );

  }

  if(
    page.classList.contains(
      'page3'
    )
  ){

    schedulePage(
      page,
      [

        [
          '.background3',
          0
        ],

        [
          '.r31',
          1.3
        ],

        [
          '.r32',
          1.65
        ],

        [
          '.r33',
          2.0
        ],

        [
          '.r34',
          2.35
        ],

        [
          '.r35',
          2.7
        ],

        [
          '.r36',
          3.05
        ],

        [
          '.r37',
          3.4
        ],

        [
          '.r38',
          3.75
        ],

        [
          '.r39',
          4.1
        ],

        [
          '.r310',
          4.45
        ],

        [
          '.r311',
          4.8
        ],

        [
          '.r312',
          5.15
        ],

        [
          '.title31',
          6.45
        ],

        [
          '.title3-reveal',
          7.75
        ],

        [
          '.details3,.icon-place-motion',
          9.05,
          true
        ],

        [
          '.message3',
          10.35
        ],

        [
          '.blessing3,.icon-gift-motion',
          11.65,
          true
        ]

      ]
    );

  }

}


/* =========================================================
   PAGE 4 PRELOAD
========================================================= */

let page4PreparePromise =
  null;

function preparePage4(){

  if(
    page4PreparePromise
  ){
    return page4PreparePromise;
  }

  const images = [

    document.querySelector(
      '#page4Modal .background4'
    ),

    document.querySelector(
      '#page4Modal .rabbit4'
    ),

    document.querySelector(
      '#page4Modal .title41'
    ),

    document.querySelector(
      '#page4Modal .title42'
    ),

    document.querySelector(
      '#page4Modal .account4'
    )

  ];

  page4PreparePromise =
    Promise.all(

      images.map(
        img=>loadImage(img)
      )

    );

  return page4PreparePromise;

}


/* =========================================================
   PAGE 2 / PAGE 3
   페이지 맨 아래 도달 시 시작
========================================================= */

function checkPageAnimationStart(){

  const rootRect =
    root.getBoundingClientRect();

  [page2,page3].forEach(page=>{

    if(
      !page ||
      page.dataset.started === '1'
    ){
      return;
    }

    const rect =
      page.getBoundingClientRect();

    /*
      해당 페이지의 맨 아래가
      화면 맨 아래 안으로 들어오는 순간 시작
    */
    if(
      rect.bottom <= rootRect.bottom &&
      rect.bottom > rootRect.top
    ){

      startPage(
        page
      );

    }

  });

}

root.addEventListener(
  'scroll',
  checkPageAnimationStart,
  {passive:true}
);

window.addEventListener(
  'resize',
  checkPageAnimationStart,
  {passive:true}
);

requestAnimationFrame(
  checkPageAnimationStart
);


/* =========================================================
   PAGE 3 진입 시 PAGE 4 PRELOAD
========================================================= */

const page4PreloadObserver =
  new IntersectionObserver(

    entries=>{

      entries.forEach(
        entry=>{

          if(
            entry.isIntersecting
          ){

            preparePage4();

            page4PreloadObserver
              .disconnect();

          }

        }
      );

    },

    {
      root:root,
      threshold:.01
    }

  );

page4PreloadObserver.observe(
  page3
);


/* =========================================================
   BGM
========================================================= */

const bgm =
  document.getElementById(
    'bgm'
  );

const btn =
  document.getElementById(
    'bgmBtn'
  );

const musicIcon =
  document.getElementById(
    'musicIcon'
  );

let isPlaying =
  false;

const iconPlaying =
  '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>';

const iconMuted =
  '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

function playAudio(){

  bgm
    .play()
    .then(()=>{

      isPlaying =
        true;

      musicIcon.innerHTML =
        iconPlaying;

    })
    .catch(()=>{});

}

function toggleBgm(){

  if(isPlaying){

    bgm.pause();

    isPlaying =
      false;

    musicIcon.innerHTML =
      iconMuted;

  }else{

    playAudio();

  }

}

btn.addEventListener(
  'click',
  e=>{

    e.stopPropagation();

    toggleBgm();

  }
);

function firstTouch(){

  if(
    !isPlaying
  ){
    playAudio();
  }

  window.removeEventListener(
    'pointerdown',
    firstTouch
  );

}

window.addEventListener(
  'pointerdown',
  firstTouch,
  {passive:true}
);


/* =========================================================
   ICON PRESS
========================================================= */

function bindPress(
  button,
  wrapper
){

  if(
    !button ||
    !wrapper
  ){
    return;
  }

  button.addEventListener(
    'pointerdown',
    ()=>{

      wrapper
        .classList
        .add(
          'is-pressed'
        );

    }
  );

  [
    'pointerup',
    'pointercancel',
    'pointerleave'

  ].forEach(
    eventName=>{

      button.addEventListener(
        eventName,
        ()=>{

          wrapper
            .classList
            .remove(
              'is-pressed'
            );

        }
      );

    }
  );

}

bindPress(

  document.getElementById(
    'placeHotspot'
  ),

  document.getElementById(
    'placeIconMotion'
  )

);

bindPress(

  document.getElementById(
    'openPage4'
  ),

  document.getElementById(
    'giftIconMotion'
  )

);


/* =========================================================
   PAGE 4
========================================================= */

const page4Modal =
  document.getElementById(
    'page4Modal'
  );

const openPage4 =
  document.getElementById(
    'openPage4'
  );

const closePage4 =
  document.getElementById(
    'closePage4'
  );

let closeTimer =
  null;

let title4Timer =
  null;


/* =========================================================
   PAGE 4 ANIMATION RESET
========================================================= */

function resetPage4Animations(){

  page4Modal
    .querySelectorAll(
      '.layer'
    )
    .forEach(el=>{

      el.style.animation =
        'none';

      void el.offsetWidth;

      el.style.animation =
        '';

    });

  const title42 =
    page4Modal.querySelector(
      '.title42'
    );

  if(title42){

    title42.style.animation =
      'none';

    void title42.offsetWidth;

    title42.style.animation =
      '';

  }

}


/* =========================================================
   PAGE 4 OPEN
========================================================= */

function showPage4(){

  preparePage4();

  if(closeTimer){

    clearTimeout(
      closeTimer
    );

    closeTimer =
      null;

  }

  if(title4Timer){

    clearTimeout(
      title4Timer
    );

    title4Timer =
      null;

  }

  page4Modal
    .classList
    .remove(
      'closing',
      'title4-ready'
    );

  resetPage4Animations();

  page4Modal
    .classList
    .add(
      'active'
    );

  page4Modal.setAttribute(
    'aria-hidden',
    'false'
  );

  title4Timer =
    setTimeout(()=>{

      if(

        page4Modal
          .classList
          .contains(
            'active'
          )

        &&

        !page4Modal
          .classList
          .contains(
            'closing'
          )

      ){

        page4Modal
          .classList
          .add(
            'title4-ready'
          );

      }

      title4Timer =
        null;

    },3900);

}


/* =========================================================
   PAGE 4 CLOSE
========================================================= */

function hidePage4(){

  if(

    !page4Modal
      .classList
      .contains(
        'active'
      )

    ||

    page4Modal
      .classList
      .contains(
        'closing'
      )

  ){
    return;
  }

  if(title4Timer){

    clearTimeout(
      title4Timer
    );

    title4Timer =
      null;

  }

  page4Modal
    .classList
    .add(
      'closing'
    );

  closeTimer =
    setTimeout(()=>{

      page4Modal
        .classList
        .remove(
          'active',
          'closing',
          'title4-ready'
        );

      page4Modal.setAttribute(
        'aria-hidden',
        'true'
      );

      closeTimer =
        null;

    },1300);

}


/* =========================================================
   PAGE 4 EVENTS
========================================================= */

openPage4.addEventListener(
  'click',
  e=>{

    e.stopPropagation();

    showPage4();

  }
);

closePage4.addEventListener(
  'click',
  e=>{

    e.stopPropagation();

    hidePage4();

  }
);

page4Modal.addEventListener(
  'click',
  e=>{

    if(

      e.target === page4Modal

      ||

      e.target
        .classList
        .contains(
          'page4-content'
        )

    ){

      hidePage4();

    }

  }
);


/* =========================================================
   COPY
========================================================= */

const copyToast =
  document.getElementById(
    'copyToast'
  );

let toastTimer =
  null;

function fallbackCopy(text){

  const textarea =
    document.createElement(
      'textarea'
    );

  textarea.value =
    text;

  textarea.setAttribute(
    'readonly',
    ''
  );

  textarea.style.position =
    'fixed';

  textarea.style.left =
    '-9999px';

  textarea.style.opacity =
    '0';

  document.body.appendChild(
    textarea
  );

  textarea.select();

  textarea.setSelectionRange(
    0,
    text.length
  );

  document.execCommand(
    'copy'
  );

  textarea.remove();

}

async function copyAccountNumber(
  value
){

  const digitsOnly =
    String(value)
      .replace(
        /\D/g,
        ''
      );

  try{

    if(
      navigator.clipboard &&
      window.isSecureContext
    ){

      await navigator
        .clipboard
        .writeText(
          digitsOnly
        );

    }else{

      fallbackCopy(
        digitsOnly
      );

    }

    if(toastTimer){

      clearTimeout(
        toastTimer
      );

    }

    copyToast
      .classList
      .remove(
        'show'
      );

    void copyToast.offsetWidth;

    copyToast
      .classList
      .add(
        'show'
      );

    toastTimer =
      setTimeout(()=>{

        copyToast
          .classList
          .remove(
            'show'
          );

        toastTimer =
          null;

      },1550);

  }catch(error){

    console.log(error);

  }

}

document
  .querySelectorAll(
    '.account-click'
  )
  .forEach(el=>{

    el.addEventListener(
      'click',
      e=>{

        e.stopPropagation();

        copyAccountNumber(
          el.dataset.account
        );

      }
    );

  });


/* =========================================================
   외부 페이지 복귀
========================================================= */

window.addEventListener(
  'pageshow',
  ()=>{

    document
      .querySelectorAll(
        '.icon-motion-wrapper'
      )
      .forEach(el=>{

        el
          .classList
          .remove(
            'is-pressed'
          );

      });

    const currentWidth =
      window.innerWidth;

    if(
      Math.abs(
        currentWidth -
        lastViewportWidth
      ) >= 1
    ){

      lastViewportWidth =
        currentWidth;

      updatePageHeights();

    }

    checkPageAnimationStart();

  }
);

</script>

</body>
</html>
